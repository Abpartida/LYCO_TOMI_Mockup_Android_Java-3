plugins {
    id 'com.android.application'
}

def fastApiBaseUrlProp = project.hasProperty("FASTAPI_BASE_URL") ? project.property("FASTAPI_BASE_URL") : "http://10.0.2.2:8080/"
def fastApiBaseUrl = fastApiBaseUrlProp.endsWith("/") ? fastApiBaseUrlProp : fastApiBaseUrlProp + "/"
def useMockServerProp = project.hasProperty("USE_MOCK_SERVER") ? project.property("USE_MOCK_SERVER").toString().toBoolean() : false

android {
    namespace 'com.lyco.tomi'
    compileSdk 34

    defaultConfig {
        applicationId "com.lyco.tomi"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        buildConfigField "String", "FASTAPI_BASE_URL", "\"${fastApiBaseUrl}\""
    }

    buildTypes {
        debug {
            buildConfigField "boolean", "IS_DEBUG", "true"
            buildConfigField "boolean", "USE_MOCK_SERVER", String.valueOf(useMockServerProp)   // controlled by -PUSE_MOCK_SERVER
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "boolean", "IS_DEBUG", "false"
            buildConfigField "boolean", "USE_MOCK_SERVER", "false"  // NEVER in release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.activity:activity:1.9.2'
    implementation 'androidx.core:core-ktx:1.13.1' // KTX is fine in Java projects for support libs

    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-moshi:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation 'com.squareup.moshi:moshi:1.15.1'
    implementation 'com.squareup.moshi:moshi-adapters:1.15.1'

    debugImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
